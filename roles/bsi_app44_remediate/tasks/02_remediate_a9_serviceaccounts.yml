---
- name: A9 - Namespaces mit fehlendem automountServiceAccountToken ermitteln
  ansible.builtin.set_fact:
    bsi_a9_affected_namespaces: >-
      {{
        bsi_raw_serviceaccounts.resources
        | selectattr('metadata.name', 'equalto', 'default')
        | rejectattr('automountServiceAccountToken', 'defined')
        | map(attribute='metadata.namespace')
        | reject('in', bsi_excluded_namespaces)
        | list
      }}

- name: A9 - Betroffene Namespaces anzeigen
  ansible.builtin.debug:
    msg: >-
      {{ 'DRY-RUN: wuerde patchen: ' if bsi_remediate_dry_run | bool else 'Patche jetzt: ' }}
      {{ bsi_a9_affected_namespaces | default([]) }}

- name: "A9 - default-ServiceAccount patchen (automountServiceAccountToken: false)"
  kubernetes.core.k8s:
    kind: ServiceAccount
    name: default
    namespace: "{{ item }}"
    definition:
      automountServiceAccountToken: false
    state: patched
  loop: "{{ bsi_a9_affected_namespaces }}"
  when:
    - not bsi_remediate_dry_run | bool
    - bsi_a9_affected_namespaces | length > 0
  register: bsi_a9_patch_result
