---
# APP.4.4.A9: Pods SOLLTEN NICHT den "default"-Service-Account nutzen.
- name: Pods ermitteln, die den default-Service-Account nutzen (implizit oder explizit)
  ansible.builtin.set_fact:
    bsi_a9_default_sa_pods: >-
      {{
        bsi_app_pods
        | rejectattr('spec.serviceAccountName', 'defined')
        | map(attribute='metadata.name')
        | list
        +
        bsi_app_pods
        | selectattr('spec.serviceAccountName', 'defined')
        | selectattr('spec.serviceAccountName', 'equalto', 'default')
        | map(attribute='metadata.name')
        | list
      }}

- name: default-ServiceAccounts mit automountServiceAccountToken != false ermitteln
  ansible.builtin.set_fact:
    bsi_a9_sa_automount_findings: >-
      {{
        bsi_raw_serviceaccounts.resources
        | selectattr('metadata.name', 'equalto', 'default')
        | rejectattr('metadata.namespace', 'in', bsi_excluded_namespaces)
        | rejectattr('automountServiceAccountToken', 'defined')
        | map(attribute='metadata.namespace')
        | list
      }}

- name: Ergebnis A9 festhalten
  ansible.builtin.set_fact:
    bsi_findings: >-
      {{
        bsi_findings | combine({
          'APP.4.4.A9': {
            'status': ((bsi_a9_default_sa_pods | length > 0) or (bsi_a9_sa_automount_findings | length > 0)) | ternary('FINDING', 'OK'),
            'details':
              (
                (
                  'Pods nutzen den default-Service-Account statt eines eigenen: ' ~ (bsi_a9_default_sa_pods | join(', ')) ~ '. '
                  if (bsi_a9_default_sa_pods | length > 0) else ''
                )
                ~
                (
                  'default-Service-Account hat in folgenden Namespaces kein explizites automountServiceAccountToken: false: ' ~ (bsi_a9_sa_automount_findings | join(', ')) ~ '.'
                  if (bsi_a9_sa_automount_findings | length > 0) else ''
                )
              ) | default('Keine Pods auf dem default-Service-Account gefunden, und der default-SA hat kein automatisches Token-Mounting aktiv.', true)
          }
        })
      }}
